<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Sales Voice Agent - Call</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>SunRise Solar &middot; AI Sales Voice Agent</h1>
    <nav><a href="/">Call</a><a href="/dashboard">Dashboard</a></nav>
  </header>

  <main class="grid">
    <section>
      <!-- Step 1: lead details (simulates a lead from a web form / ad) -->
      <div class="card" id="lead-card">
        <h2>Lead details</h2>
        <label for="name">Name *</label>
        <input id="name" placeholder="Rahul Sharma">
        <label for="phone">Phone * (used to remember the lead)</label>
        <input id="phone" placeholder="9876543210">
        <label for="email">Email</label>
        <input id="email" placeholder="rahul@example.com">
        <label for="language">Language</label>
        <select id="language"><option value="auto">Auto-detect (recommended)</option></select>
        <div class="row">
          <button id="start-btn">Start call</button>
        </div>
        <p class="muted">Tip: use headphones so the agent's voice is not picked up by your mic.</p>
        <div id="start-error" class="error"></div>
      </div>

      <!-- Step 2: live call controls -->
      <div class="card hidden" id="call-card">
        <h2>Live call <span id="status" class="pill idle">Idle</span></h2>
        <div>Lead: <span id="lead-status" class="badge NEW">NEW</span> score <strong id="lead-score">0</strong>/100</div>
        <div class="bant" id="bant"></div>
        <label><input type="checkbox" id="allow-interrupt" autocomplete="off" style="width:auto"> Allow interrupting the agent (use headphones)</label>
        <label for="text-input">Mic not working? Type instead:</label>
        <div class="row" style="margin-top:0">
          <input id="text-input" placeholder="Type what the caller says...">
          <button class="secondary" id="send-text-btn">Send</button>
        </div>
        <div class="row">
          <button class="danger" id="end-btn">End call</button>
        </div>
        <div id="call-error" class="error"></div>
      </div>

      <!-- Step 3: post-call summary -->
      <div class="card hidden" id="summary-card">
        <h2>Call summary</h2>
        <div id="summary"></div>
        <div class="row"><button class="secondary" onclick="location.reload()">New call</button>
          <a href="/dashboard"><button>Open dashboard</button></a></div>
      </div>
    </section>

    <section class="card">
      <h2>Transcript</h2>
      <div id="transcript"><p class="muted">The conversation will appear here.</p></div>
    </section>
  </main>

  <!-- Voice activity detection (Silero VAD running in the browser via ONNX Runtime).
       Files are served locally from /static/vendor so the demo does not depend on a CDN. -->
  <script src="/static/vendor/ort/ort.wasm.min.js"></script>
  <script src="/static/vendor/vad/bundle.min.js"></script>
  <script src="/static/call.js"></script>
</body>
</html>
